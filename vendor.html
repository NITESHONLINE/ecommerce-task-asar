<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store List</title>
    <script src="https://kit.fontawesome.com/4531127e67.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/vendor_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <div class="header_left">
            <ul>
                <a href="">
                    <li>
                        <i class="fa-solid fa-location-dot"></i>
                        Find Store
                    </li>
                </a>
                |
                <a href="">
                    <li>
                        <i class="fa-regular fa-envelope"></i>
                        support@digic.com
                    </li>
                    </li>
                </a>
            </ul>
        </div>
        <div class="header_right">
            <ul>
                <a href="">

                    <li> Contact </li>
                </a>
                |
                <a href="">
                    <li> Track Your Order</li>
                </a>
            </ul>
        </div>
    </header>
    <nav>
        <div class="nav_up">
            <img src="vendorassets/images/logo.png" alt="logo" class="logo">
            <div class="search_box">
                <input type="text" placeholder="Search product...">
                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <div class="account_actions">
                <a href="">Login / Sign up</a>

                <button class="icon_btn">
                    <i class="fa-regular fa-heart"></i>
                    <span class="badge blue">0</span>
                </button>

                <button class="icon_btn">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="badge red">0</span>
                </button>
            </div>

        </div>
        <div class="nav_down">
            <button class="departments">
                <i class="fa-solid fa-bars"></i>
                All Departments
                <i class="fa-solid fa-chevron-down"></i>
            </button>

            <div class="menu">
                <a href="">Home <i class="fa-solid fa-chevron-down"></i></a>
                <a href="">Shop <i class="fa-solid fa-chevron-down"></i></a>
                <a href="">Blog <i class="fa-solid fa-chevron-down"></i></a>
                <a href="">Page <i class="fa-solid fa-chevron-down"></i></a>
                <div class="vendor_dropdown">
                    <a href="" class="active">
                        Vendor <i class="fa-solid fa-chevron-down"></i>
                    </a>

                    <ul class="vendor_list">
                        <li><a href="">Store List</a></li>
                        <li><a href="">Store Details</a></li>
                    </ul>
                </div>
            </div>

            <strong class="delivery">
                FREE <span>express international delivery!</span>
            </strong>
        </div>

    </nav>
</body>

</html>
